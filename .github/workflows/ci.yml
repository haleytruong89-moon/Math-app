# Checks every pull request: lint, database/RLS tests, production build.
name: CI

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No local e2e patch committed
        run: "! grep -rn \"E2E_ROLE\\|e2e-fake\" src"
      - run: npm run lint
      - run: npm test
      - run: npm run build
